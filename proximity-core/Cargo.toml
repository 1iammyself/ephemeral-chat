[workspace]
members = [
    "core",
    "bindings/node",
    "bindings/android",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# QUIC transport
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# mDNS discovery
mdns-sd = "0.11"

# TLS certificate generation
rcgen = "0.13"

# Cryptography
ring = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Utilities
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
dashmap = "6"
thiserror = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
hostname = "0.4"
