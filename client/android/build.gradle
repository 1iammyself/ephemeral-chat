// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Permanent fix: Override proguard settings for all subprojects (including node_modules plugins)
// This ensures 'proguard-android-optimize.txt' is used instead of deprecated 'proguard-android.txt'
subprojects {
    configurations.all {
        resolutionStrategy {
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    if (details.requested.name != 'kotlin-android-extensions-runtime') {
                        details.useVersion rootProject.ext.kotlin_version
                    }
                }
            }
        }
    }

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                buildTypes {
                    release {
                        proguardFiles.clear()
                        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    }
                }
            }
        }
    }
}
