name: Client Games Contract CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: client-games-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-games-contract:
    name: Build + Games Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Games contract regression guard
        run: npm run test:games-contract

      - name: Client production build
        run: npm run build
