[package]
name = "ephchat-crypto"
version = "0.1.0"
edition = "2021"

[lib]
name = "ephchat_crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Authenticated Encryption
aes-gcm = "0.10"

# Elliptic Curve
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }

# Key Derivation
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"

# Memory Safety
zeroize = { version = "1.7", features = ["zeroize_derive", "derive"] }

# Random Number Generation
rand = "0.8"
rand_core = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
hex = "0.4"

# Post-Quantum Cryptography
ml-kem = { version = "0.3.0-rc.2", features = ["getrandom", "zeroize"] }

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
